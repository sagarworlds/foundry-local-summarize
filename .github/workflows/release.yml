name: Build and Release Installer

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Needed to create a GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Uses .NET 10 as specified in your csproj

      - name: Run Tests
        # A release must never ship code that fails its own tests.
        run: dotnet test tests/FoundrySummarizer.Tests/FoundrySummarizer.Tests.csproj -c Release

      - name: Publish WPF Application
        run: |
          dotnet publish src/FoundrySummarizer.Wpf/FoundrySummarizer.Wpf.csproj -c Release -r win-x64 --self-contained false
        
      - name: Compile Inno Setup Script
        run: |
          # Inno Setup is pre-installed on GitHub Actions windows-latest runners
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Create Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/FoundrySummarizerSetup.exe
          generate_release_notes: true
