name: CI

# Builds the whole solution and runs the tests on every push and pull request, so a change that breaks the build
# or a test is caught before it reaches main or a release.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows, because the desktop app is WPF; building it here also checks the XAML.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FoundrySummarizer.slnx -c Release

      - name: Test
        # --blame-hang-timeout ends a hanging test (and names it) instead of blocking the job.
        run: >
          dotnet test tests/FoundrySummarizer.Tests/FoundrySummarizer.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --blame-hang-timeout 2m
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
